[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geosym-world"
version = "0.1.0"
description = "Geometry state, synthesis, parsing, rendering, and benchmark foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "Pillow>=10,<13",
  "pylatexenc>=2.10,<3",
  "sympy>=1.13,<2",
  "timeout-decorator>=0.5,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
geosym-synthesize = "geosym_world.tools.synthesize_records:main"
geosym-render-pilot = "geosym_world.tools.render_pilot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
